services:
  eduscope-web:
    container_name: eduscope-web
    build:
      context: ./eduscope-web
      dockerfile: Dockerfile
    image: eduscope-web:local
    restart: unless-stopped
    ports:
      - "${EDUSCOPE_WEB_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      EDUSCOPE_DB_URL: ${EDUSCOPE_DB_URL:-jdbc:oracle:thin:@host.docker.internal:1521/orcl}
      EDUSCOPE_DB_USERNAME: ${EDUSCOPE_DB_USERNAME}
      EDUSCOPE_DB_PASSWORD: ${EDUSCOPE_DB_PASSWORD}
      EDUSCOPE_LOG_FILE: /app/logs/eduscope-web.log
      EDUSCOPE_LOG_LEVEL: ${EDUSCOPE_LOG_LEVEL:-INFO}
      EDUSCOPE_HADOOP_SSH_HOST: ${EDUSCOPE_HADOOP_SSH_HOST:-192.168.117.10}
      EDUSCOPE_HADOOP_SSH_PORT: ${EDUSCOPE_HADOOP_SSH_PORT:-22}
      EDUSCOPE_HADOOP_SSH_USER: ${EDUSCOPE_HADOOP_SSH_USER:-user}
      EDUSCOPE_HADOOP_SSH_PRIVATE_KEY: /home/eduscope/.ssh/eduscope_vm_ed25519
      EDUSCOPE_HADOOP_ENV_SCRIPT: ${EDUSCOPE_HADOOP_ENV_SCRIPT:-/home/user/bigdata/user-eduscope-hadoop.sh}
      EDUSCOPE_HADOOP_JAR: ${EDUSCOPE_HADOOP_JAR:-/home/user/eduscope-app/eduscope-mapreduce-1.0.0-SNAPSHOT.jar}
      EDUSCOPE_HADOOP_TIMEOUT_MINUTES: ${EDUSCOPE_HADOOP_TIMEOUT_MINUTES:-120}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ./eduscope-web/logs
        target: /app/logs
      - type: bind
        source: ${EDUSCOPE_SSH_KEY_PATH}
        target: /home/eduscope/.ssh/eduscope_vm_ed25519
        read_only: true
      - type: bind
        source: ${EDUSCOPE_SSH_KNOWN_HOSTS_PATH}
        target: /home/eduscope/.ssh/known_hosts
        read_only: true
    stop_grace_period: 30s

  eduscope-frontend:
    container_name: eduscope-frontend
    build:
      context: ./eduscope-frontend
      dockerfile: Dockerfile
    image: eduscope-frontend:local
    restart: unless-stopped
    ports:
      - "${EDUSCOPE_FRONTEND_PORT:-5173}:80"
    depends_on:
      - eduscope-web
