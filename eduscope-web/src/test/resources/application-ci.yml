spring:
  datasource:
    # GitHub Actions에는 Oracle이 없으므로 Context/단위/보안 테스트용 H2를 사용한다.
    url: jdbc:h2:mem:eduscope;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=true
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

logging:
  file:
    name: ${java.io.tmpdir}/eduscope-ci.log
  level:
    root: WARN
    com.eduscope.web: INFO
